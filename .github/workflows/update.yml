name: Taegliche Aktualisierung (Kurse + Nachtapotheken)

on:
  schedule:
    # jeden Tag 17:23 UTC (= 18:23 Uhr in Marokko) – vor dem Abend, wenn die Nachtdienste gelten
    - cron: "23 17 * * *"
  workflow_dispatch: {}   # Knopf "Run workflow" zum manuellen Starten

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests beautifulsoup4
      - run: python scripts/update.py
      - name: Aenderungen speichern
        run: |
          if git diff --quiet; then
            echo "Keine Aenderungen."
            exit 0
          fi
          git config user.name "fair-price-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/index.html
          git commit -m "Automatische Aktualisierung $(date -u +%F)"
          git push
