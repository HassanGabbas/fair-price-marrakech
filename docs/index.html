<!DOCTYPE html>
<html lang="de" translate="no" class="notranslate">
<head>
<meta charset="utf-8">
<meta name="google" content="notranslate">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fair Price Marrakech</title>
<meta name="description" content="Fair prices for taxis, souks, food, hotels and tours in Marrakech – with SOS numbers, night pharmacies and live exchange rates.">
<meta name="theme-color" content="#2445C7">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" sizes="192x192">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Plan: kühles Grau mit Majorelle-Blau als Akzent; Ampelfarben nur für Bewertungen.
   Layout: eine Spalte wie eine Handy-App – Suche, Kategorien mit Symbolen, Liste, Detail als Bottom-Sheet. */
:root{
  --bg:#F2F4F9; --surface:#FFFFFF; --ink:#131C33; --muted:#5A6378; --line:#DCE1EC; --accent:#2445C7; --accent-ink:#FFFFFF; --tint:#E7ECFB;
  --good:#17845A; --good-bg:#E3F4EC; --ok:#B87A06; --ok-bg:#FBF0D6; --bad:#C1352B; --bad-bg:#FBE5E2;
  --display:"Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --body:"Figtree", "Segoe UI", system-ui, sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1322; --surface:#171E31; --ink:#E8ECF6; --muted:#9AA3B8; --line:#2A3350; --accent:#7F9BFF; --accent-ink:#0E1322; --tint:#1F2947;
    --good:#4CC28F; --good-bg:#14322A; --ok:#E7B34A; --ok-bg:#352A12; --bad:#F07A6E; --bad-bg:#3A1C1A;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1322; --surface:#171E31; --ink:#E8ECF6; --muted:#9AA3B8; --line:#2A3350; --accent:#7F9BFF; --accent-ink:#0E1322; --tint:#1F2947;
  --good:#4CC28F; --good-bg:#14322A; --ok:#E7B34A; --ok-bg:#352A12; --bad:#F07A6E; --bad-bg:#3A1C1A;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45}
.wrap{max-width:640px;margin:0 auto;padding:16px 16px 40px}
header{position:relative;display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand h1{font-family:var(--display);font-weight:800;font-size:1.75rem;line-height:1.1;margin:0;letter-spacing:-.01em;text-wrap:balance}
.brand h1 span{color:var(--accent)}
.brand p{margin:4px 0 0;color:var(--muted);font-size:.95rem;max-width:36ch}
.langs{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px}
.langs button{border:0;background:transparent;color:var(--muted);font:600 .85rem var(--body);padding:6px 11px;border-radius:999px;cursor:pointer}
.langs button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.inst{background:var(--accent)!important;color:var(--accent-ink)!important;border-color:var(--accent)!important}
.insthint{margin:10px 0 0;padding:10px 12px;background:var(--tint);border-radius:10px;font-size:.9rem}
.wx{position:absolute;top:0;inset-inline-end:0;z-index:3;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:14px;padding:6px 10px;font:inherit;cursor:pointer;text-align:center;line-height:1.15;min-width:78px}
.wx .i{font-size:1.25rem}.wx .c{font:800 1.15rem var(--display)}.wx small{display:block;color:var(--muted);font-size:.72rem;font-variant-numeric:tabular-nums}
.haswx .brand{padding-inline-end:92px}
.wxp{margin:12px 0 0;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px}
.wxp h3{margin:0 0 8px;font-size:.95rem}
.wxd{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;text-align:center}
.wxd div{background:var(--tint);border-radius:10px;padding:8px 4px;font-size:.8rem;line-height:1.35}
.wxd b{display:block;font-size:.85rem}.wxd .e{font-size:1.5rem;line-height:1.2}.wxd .t{font-weight:700;font-variant-numeric:tabular-nums}
.wxh{margin:8px 0 0;font-size:.82rem;color:var(--muted)}
.wx small,.wxd .t{direction:ltr;unicode-bidi:isolate}
.langsel{font:600 .9rem var(--body);color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:7px 10px;cursor:pointer;max-width:11em}
.sbox{position:relative}
.sbox input{padding-inline-end:58px}
.mic{position:absolute;inset-inline-end:6px;top:50%;transform:translateY(-50%);width:44px;height:44px;border:0;border-radius:10px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;cursor:pointer}
.mic svg{width:22px;height:22px}
.mic.on{background:var(--bad);animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 8px rgba(193,53,43,.18)}}
.micmsg{margin:6px 2px 0;font-size:.85rem;color:var(--muted)}
.micmsg:empty{display:none}
.check .row .mic{position:static;transform:none;flex:none}
.sugg{margin-top:10px;display:flex;flex-wrap:wrap;gap:6px;justify-content:center;align-items:center}
.sugg button{border:1px solid var(--line);background:var(--surface);color:var(--accent);font:600 .9rem var(--body);padding:7px 12px;border-radius:999px;cursor:pointer}
[dir="rtl"] .note{border-left:0;border-right:3px solid var(--ok)}
[dir="rtl"] .card,[dir="rtl"] .slide span{text-align:right}
[dir="rtl"] .card .r{text-align:left}
[dir="rtl"] .dot{margin-right:0;margin-left:5px}
[dir="rtl"] .ico:empty{margin-right:0;margin-left:-12px}
[dir="rtl"] .info td:first-child{padding-right:0;padding-left:12px}
.barwrap{direction:ltr}
:lang(zh) body,:lang(zh) .chip,:lang(zh) button,:lang(zh) input,:lang(zh) select{font-family:"Figtree","PingFang SC","Noto Sans SC","Microsoft YaHei",system-ui,sans-serif}
:lang(ar) body,:lang(ar) .chip,:lang(ar) button,:lang(ar) input,:lang(ar) select{font-family:"Figtree","Noto Sans Arabic","Segoe UI","Geeza Pro",Tahoma,system-ui,sans-serif}
.note{margin:14px 0 0;padding:10px 12px;border-left:3px solid var(--ok);background:var(--ok-bg);border-radius:6px;font-size:.88rem}
.search{margin:16px 0 10px}
.search input{width:100%;padding:13px 14px;font:500 1rem var(--body);color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:12px}
.fx{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:.85rem;color:var(--muted);flex-wrap:wrap}
.fx label{font-weight:600}
.fx select,.fx input{font:600 .9rem var(--body);color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 8px}
.fx input{width:6.5em;font-variant-numeric:tabular-nums}
.fx .lnk{border:0;background:none;color:var(--accent);font:600 .85rem var(--body);cursor:pointer;padding:4px 2px;text-decoration:underline}
.fx .own{color:var(--ok);font-weight:700}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:600 .85rem var(--body);padding:7px 12px;border-radius:999px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.hero{position:relative;margin:10px 0 6px;border-radius:14px;overflow:hidden;height:118px;background:var(--line)}
.hero img{width:100%;height:100%;object-fit:cover;display:block}
.hero small{position:absolute;right:8px;bottom:6px;color:#fff;font-size:.68rem;opacity:.85;text-shadow:0 1px 2px rgba(0,0,0,.6)}
[dir="rtl"] .hero small{right:auto;left:8px}
.crow{margin:14px 0 4px}
.cban{position:relative;display:block;width:100%;height:92px;border:0;padding:0;border-radius:14px;overflow:hidden;background:var(--line);text-align:start}
.cban img{width:100%;height:100%;object-fit:cover;display:block}
.cban::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(10,8,20,.62),rgba(10,8,20,.05) 70%)}
[dir="rtl"] .cban::after{background:linear-gradient(270deg,rgba(10,8,20,.62),rgba(10,8,20,.05) 70%)}
.cban .ct{position:absolute;z-index:1;inset-inline-start:14px;top:12px;color:#fff;font:800 1.2rem/1.15 var(--display);max-width:70%;text-shadow:0 1px 3px rgba(0,0,0,.4)}
.cban .ca{position:absolute;z-index:1;inset-inline-start:14px;bottom:10px;color:#fff;font:600 .82rem var(--body);background:rgba(255,255,255,.22);padding:3px 10px;border-radius:999px;backdrop-filter:blur(2px)}
.sw{position:absolute;z-index:2;inset-inline-end:10px;bottom:10px;display:flex;gap:8px;direction:ltr}
.sw button{width:40px;height:40px;border-radius:50%;border:0;background:rgba(255,255,255,.92);color:#131C33;font:800 1.5rem/1 var(--body);cursor:pointer;display:grid;place-items:center;padding:0 0 3px;box-shadow:0 1px 4px rgba(0,0,0,.25)}
.cban.big{height:130px;cursor:default}
.hs{display:flex;gap:8px;overflow-x:auto;padding:8px 2px 4px;scroll-snap-type:x proximity;scrollbar-width:none}
.hs::-webkit-scrollbar{display:none}
.mc{flex:none;width:128px;scroll-snap-align:start;display:flex;flex-direction:column;gap:4px;text-align:start;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px;cursor:pointer;color:var(--ink);font:inherit}
.mc .sy{font-size:1.6rem;line-height:1}
.mc .n{font-weight:600;font-size:.84rem;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.5em}
.mc .v{font-size:.72rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mc .k{font-size:.7rem;color:var(--muted);margin-top:auto}
.mc b{font-size:1rem;white-space:nowrap;font-variant-numeric:tabular-nums;color:var(--good)}
.mc b.f{color:var(--accent)}
.mc.more{justify-content:center;align-items:center;color:var(--accent);font-weight:700;background:var(--tint);border-color:transparent}
.back{border:0;background:none;color:var(--accent);font:700 .95rem var(--body);padding:6px 0;cursor:pointer}
.illus{color:var(--muted);font-size:.72rem;margin:12px 2px 0}
.count{color:var(--muted);font-size:.85rem;margin:8px 2px}
.list{display:grid;gap:8px}
.card{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer;color:var(--ink);font:inherit}
.card:hover{border-color:var(--accent)}
.ico{width:44px;height:44px;border-radius:10px;background:var(--tint);overflow:hidden;flex:none;display:grid;place-items:center;font-size:1.5rem;line-height:1}
.ico:empty{width:0;margin-right:-12px;background:none}
.ico img{width:100%;height:100%;object-fit:cover;border-radius:10px;display:block}
.card .t{font-weight:700;line-height:1.25}
.card .s{color:var(--muted);font-size:.85rem;margin-top:2px}
.card .r{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.card .r b{display:block;font-size:1rem}
.card .r small{color:var(--muted);font-size:.78rem}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:1px}
.dot.g{background:var(--good)}.dot.f{background:var(--accent)}
.empty{padding:24px;text-align:center;color:var(--muted)}
.budget{margin-top:22px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px}
.budget h2{font-family:var(--display);font-size:1.1rem;margin:0 0 8px}
.budget .rows{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.budget .rows div{border:1px solid var(--line);border-radius:10px;padding:8px}
.budget .k{font-size:.78rem;color:var(--muted)} .budget .v{font-weight:700;font-variant-numeric:tabular-nums} .budget .e{font-size:.78rem;color:var(--muted);font-variant-numeric:tabular-nums}
.budget p{margin:8px 0 0;font-size:.8rem;color:var(--muted)}
.hdr-r{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sosbtn{border:0;background:var(--bad);color:#fff;font:700 .85rem var(--body);padding:8px 14px;border-radius:999px;cursor:pointer;letter-spacing:.02em}
.infobtn{border:1px solid var(--line);background:var(--surface);color:var(--ink);font:700 .85rem var(--body);padding:8px 14px;border-radius:999px;cursor:pointer}
.emg{display:grid;gap:8px;margin:14px 0}
.emg a{display:grid;grid-template-columns:5.2rem 1fr;align-items:center;gap:12px;text-decoration:none;color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:10px 14px;background:var(--bg)}
.emg a b{font-family:var(--display);font-size:1.9rem;color:var(--bad);font-variant-numeric:tabular-nums;line-height:1}
.emg a.tp b{font-size:1.05rem}
.muted{color:var(--muted);font-size:.85rem}
.ph{display:grid;gap:8px;margin-top:6px}
.ph .p{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--bg)}
.ph .p b{display:block}
.ph .p .acts{display:flex;gap:14px;margin-top:4px;flex-wrap:wrap}
.ph .p a{color:var(--accent);font-weight:600;font-variant-numeric:tabular-nums}
.phh{font-family:var(--display);font-size:1.1rem;margin:18px 0 4px}
.info{margin-top:22px}
.info>h2{font-family:var(--display);font-size:1.25rem;margin:0 0 8px}
.info details{background:var(--surface);border:1px solid var(--line);border-radius:12px;margin-bottom:8px;overflow:hidden}
.info summary{cursor:pointer;padding:13px 14px;font-weight:700;list-style:none;display:flex;justify-content:space-between;align-items:center}
.info summary::-webkit-details-marker{display:none}
.info summary::after{content:"+";font-size:1.2rem;color:var(--muted)}
.info details[open] summary::after{content:"–"}
.info .bd{padding:0 14px 14px;display:grid;gap:10px}
.info .it{border-top:1px solid var(--line);padding-top:10px}
.info .it:first-child{border-top:0;padding-top:0}
.info .it b{display:block}
.info .it a{color:var(--accent);font-weight:600;font-variant-numeric:tabular-nums}
.info table{width:100%;border-collapse:collapse;font-size:.92rem}
.info td{padding:7px 4px;border-top:1px solid var(--line);vertical-align:top}
.info tr:first-child td{border-top:0}
.info td:first-child{font-weight:700;white-space:nowrap;padding-right:12px}
footer{margin-top:18px;color:var(--muted);font-size:.8rem;display:grid;gap:4px}
.scrim{position:fixed;inset:0;background:rgba(10,14,28,.45);display:none;z-index:10}
.sheet{position:fixed;left:0;right:0;bottom:0;max-height:92%;overflow-y:auto;background:var(--surface);border-radius:18px 18px 0 0;padding:18px 18px 28px;z-index:11;display:none;max-width:640px;margin:0 auto;box-shadow:0 -8px 30px rgba(0,0,0,.18)}
.open .scrim,.open #sheet,.sos .scrim,.sos #sosSheet{display:block}
.sheet .top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.sheet .head{display:flex;gap:12px;align-items:flex-start}
.sheet h2{font-family:var(--display);font-weight:800;font-size:1.4rem;line-height:1.15;margin:0;text-wrap:balance}
.sheet .sub{color:var(--muted);margin-top:4px}
.x{border:1px solid var(--line);background:var(--bg);color:var(--ink);width:36px;height:36px;border-radius:50%;font-size:1.1rem;cursor:pointer;flex:none}
.figs{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:16px 0}
.figs.three{grid-template-columns:repeat(3,1fr)}
.fig{border:1px solid var(--line);border-radius:10px;padding:10px}
.fig .k{font-size:.78rem;color:var(--muted)}
.fig .v{font-weight:700;font-size:1.15rem;font-variant-numeric:tabular-nums}
.fig .e{font-size:.78rem;color:var(--muted);font-variant-numeric:tabular-nums}
.fig.g{border-color:var(--good);background:var(--good-bg)}
.fig.y{border-color:var(--ok);background:var(--ok-bg)}
.range{margin:-6px 0 14px;font-size:.88rem;color:var(--muted)}
.bar{height:14px;border-radius:7px;overflow:hidden;display:flex;margin:6px 0 4px}
.bar i{display:block;height:100%}
.bar .zg{background:var(--good)}.bar .zy{background:var(--ok)}.bar .zr{background:var(--bad)}
.barwrap{position:relative;margin:4px 0 18px}
.ticks{position:relative;height:16px;font-size:.75rem;color:var(--muted);font-variant-numeric:tabular-nums}
.ticks span{position:absolute;transform:translateX(-50%);white-space:nowrap}
.marker{position:absolute;top:-6px;width:4px;height:26px;background:var(--ink);border-radius:2px;transform:translateX(-50%);display:none}
.check label{display:block;font-weight:700;margin-bottom:6px}
.row{display:flex;gap:8px}
.row input{flex:1;min-width:0;padding:13px 14px;font:600 1.1rem var(--body);color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:12px;font-variant-numeric:tabular-nums}
.row .unit{align-self:center;color:var(--muted);font-weight:600}
.verdict{margin-top:12px;border-radius:12px;padding:14px;display:none}
.verdict.good{display:block;background:var(--good-bg);border:1px solid var(--good)}
.verdict.ok{display:block;background:var(--ok-bg);border:1px solid var(--ok)}
.verdict.bad{display:block;background:var(--bad-bg);border:1px solid var(--bad)}
.verdict h3{margin:0 0 4px;font-family:var(--display);font-size:1.15rem}
.verdict p{margin:0}
.tip{margin-top:16px;padding:12px;border-radius:10px;background:var(--bg);font-size:.92rem}
.tip b{display:block;font-size:.78rem;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin-bottom:2px}
.flag{margin-top:10px;font-size:.88rem;color:var(--bad)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .18s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}}
@media (max-width:380px){.figs,.figs.three,.budget .rows{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <button type="button" class="wx" id="wxBtn" hidden></button>
    <div class="brand"><h1>Fair Price <span>Marrakech</span></h1><p id="tagline"></p></div>
    <div class="hdr-r"><button type="button" class="sosbtn" id="sosBtn"></button><button type="button" class="infobtn" id="infoBtn"></button><button type="button" class="infobtn inst" id="instBtn" hidden></button>
    <select class="langsel" id="langSel" aria-label="Language">
      <option value="de">🇩🇪 Deutsch</option><option value="en">🇬🇧 English</option><option value="fr">🇫🇷 Français</option><option value="es">🇪🇸 Español</option><option value="it">🇮🇹 Italiano</option><option value="nl">🇳🇱 Nederlands</option><option value="pl">🇵🇱 Polski</option><option value="zh">🇨🇳 中文</option><option value="ar">🇲🇦 العربية</option>
    </select></div>
  </header>
  <div class="wxp" id="wxPanel" hidden></div>
  <p class="insthint" id="instHint" hidden></p>
  <div class="search"><div class="sbox"><input id="q" type="search" autocomplete="off" enterkeyhint="search"><button type="button" class="mic" id="micQ"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button></div><p class="micmsg" id="micMsg" aria-live="polite"></p>
    <div class="fx">
      <label for="cur" id="curLbl"></label>
      <select id="cur"><option value="EUR">€ EUR</option><option value="GBP">£ GBP</option><option value="USD">$ USD</option><option value="CHF">CHF</option><option value="CAD">CA$ CAD</option></select>
      <span id="rate"></span>
      <button type="button" class="lnk" id="fxEditBtn"></button>
    </div>
    <div class="fx" id="fxEdit" hidden>
      <label for="fxIn" id="fxInLbl"></label><input id="fxIn" type="number" inputmode="decimal" step="0.01" min="0"><span>MAD</span>
      <button type="button" class="lnk" id="fxReset"></button>
    </div>
  </div>
  <div class="chips" id="chips"></div>
  <div id="rows"></div>
  <div id="catHead"></div>
  <div class="count" id="count"></div>
  <div class="list" id="list"></div>
  <section class="info" id="info"></section>
  <section class="budget" aria-labelledby="bH"><h2 id="bH"></h2><div class="rows" id="bRows"></div><p id="bNote"></p></section>

function judge(){

  if(it.p!=null){
    if(it.p===0){ if(v===0){cls="good";h=t.vFreeH;p=t.vFree;} else {cls="bad";h=t.vFreeH;p=t.vFree;} }
    else if(v<=it.p*1.02){cls="good";h=t.vFixOkH;p=t.vFixOk;} else {cls="bad";h=t.vFixBadH;p=t.vFixBad(mad(it.p));}

    else if(v<=it.y){cls="ok"; if(sp){h=t.vSOkH;p=t.vSOk(mad(it.g));} else {h=t.vOkH;p=t.vOk(mad(it.g));}}

    const m=$("marker"); m.style.display="block"; m.style.left=Math.min(v/it._max*100,99)+"%";
  }
  box.className="verdict "+cls; box.innerHTML="<h3></h3><p></p>"; box.firstChild.textContent=h; box.lastChild.textContent=p;
  if(it.p==null&&v>it.g){ const s=document.createElement("p"); s.style.marginTop="6px"; s.style.fontWeight="600"; s.textContent=t.over(Math.round((v/it.g-1)*100))+" · "+fx(v); box.appendChild(s); }

const ALLTOK=[...new Set(IDX.flatMap(x=>x.toks).filter(w=>w.length>=4&&!/^\d+$/.test(w)))];
function lev(a,b,max){ if(Math.abs(a.length-b.length)>max) return max+1;
  let prev=Array.from({length:b.length+1},(_,i)=>i);
  for(let i=1;i<=a.length;i++){ const cur=[i]; let best=i;
    for(let j=1;j<=b.length;j++){ cur[j]=Math.min(prev[j]+1,cur[j-1]+1,prev[j-1]+(a[i-1]===b[j-1]?0:1)); if(cur[j]<best) best=cur[j]; }
    if(best>max) return max+1; prev=cur; }
  return prev[b.length]; }
const tol=(w)=>w.length>=7?2:w.length>=4?1:0;
function prepQuery(raw){
  let q=normS(raw); let words=[];
  for(const w of q.split(" ").filter(Boolean)){
    if(STOP.has(w)) continue;
    if(/^\d+$/.test(w)) continue;
    if(w.startsWith("ال")&&w.length>4&&!STOP.has(w.slice(2))) { words.push(w.slice(2)); continue; }
    words.push(w);
  }
  return words;
}
function wordScore(w,x){
  if(CJK.test(w)){ if(x.txt.includes(w)) return 3; let h=0; for(let i=0;i<w.length-1;i++) if(x.txt.includes(w.slice(i,i+2))) h++; return h&&h>=Math.ceil((w.length-1)/2)?1.2:0; }
  let best=0; const isSyn=SYN_IDX.has(w);
  for(const tk of x.toks){
    if(tk===w) return x.name.split(" ").includes(w)?4:3;
    if(w.length>=3&&tk.startsWith(w)) best=Math.max(best,isSyn?1.4:2.4);
    else if(w.length>=4&&tk.includes(w)) best=Math.max(best,w.length>=5?2.2:1.8);
    else if(tk.length>=5&&w.length>=5&&w.startsWith(tk)) best=Math.max(best,1.6); /* Plural / Endungen */
  }
  if(best<1.5&&w.length>=3){ const g=SYN_IDX.get(w)||[]; let gs=g;
    if(!gs.length&&tol(w)){ for(const [k,v] of SYN_IDX) if(Math.abs(k.length-w.length)<=tol(w)&&lev(w,k,tol(w))<=tol(w)){ gs=v; break; } }
    for(const gi of gs) for(const s of SYN[gi]) if(s!==w&&(CJK.test(s)?x.txt.includes(s):x.toks.includes(s)||(s.length>=5&&x.toks.some(t=>t.startsWith(s))))){ best=Math.max(best,isSyn?2.6:2); break; } }
  if(best<1&&tol(w)){ const m=tol(w); for(const tk of x.toks){ if(tk.length<4) continue; if(lev(w,tk,m)<=m){ best=Math.max(best,1.2); break; } if(tk.length>w.length&&w.length>=6&&lev(w,tk.slice(0,w.length),1)<=1){ best=Math.max(best,1); } } }
  return best;
}
function search(raw,cat){
  const words=prepQuery(raw);
  if(!words.length) return {words:[],res:DATA.items.filter(it=>cat<0||it.c===cat)};
  const scored=[];
  for(const x of IDX){ let sc=0,hit=0; for(const w of words){ const s=wordScore(w,x); if(s>0){hit++; sc+=s;} } if(hit) scored.push({it:x.it,sc,hit}); }
  if(!scored.length) return {words,res:[]};
  const top=Math.max(...scored.map(s=>s.hit));
  const need=words.length>=3?Math.max(top,Math.ceil(words.length*0.6)):top;
  const keep=scored.filter(s=>s.hit>=Math.min(need,top)); const bestSc=Math.max(...keep.map(s=>s.sc));
  const res=keep.filter(s=>s.sc>=bestSc*0.5).sort((a,b)=>b.hit-a.hit||b.sc-a.sc).map(s=>s.it);
  return {words,res};
}
function suggest(raw){
  const words=prepQuery(raw).filter(w=>!CJK.test(w)&&w.length>=3); const out=new Set();
  for(const w of words){ let best=null,bd=9; for(const tk of ALLTOK){ const d=lev(w,tk,3); if(d<bd){bd=d;best=tk;} } if(best&&bd<=Math.max(tol(w),1)+1&&bd<w.length/2) out.add(best); }
  return [...out].slice(0,3);
}

function numFrom(text){
  const ar="٠١٢٣٤٥٦٧٨٩"; let s=String(text).replace(/[٠-٩]/g,d=>ar.indexOf(d));
  s=s.replace(/(\d)[\s.,](?=\d{3}\b)/g,"$1");
  const m=s.match(/\d+(?:[.,]\d+)?/); if(m) return parseFloat(m[0].replace(",","."));
  const tw=NUMW[lang]; if(!tw) return null; let tot=0,curv=0,any=false;
  for(const w of normS(s).split(" ")){ if(!(w in tw)) continue; any=true; const v=tw[w]; if(v===100){curv=(curv||1)*100;} else if(v===1000){tot+=(curv||1)*1000;curv=0;} else curv+=v; }
  return any?tot+curv:null;
}

function stopRec(){ try{ rec&&rec.abort(); }catch(e){} rec=null; document.querySelectorAll(".mic").forEach(b=>b.classList.remove("on")); }
function startVoice(target){
  const t=T[lang], msg=$(target==="q"?"micMsg":"micMsgP");
  if(rec){ stopRec(); return; }
  if(!SR){ msg.textContent=t.noMic; return; }
  try{ rec=new SR(); }catch(e){ msg.textContent=t.noMic; return; }
  recTarget=target; rec.lang=SR_LANG[lang]||"en-GB"; rec.interimResults=true; rec.maxAlternatives=3; rec.continuous=false;
  const btn=$(target==="q"?"micQ":"micP"); btn.classList.add("on"); msg.textContent=t.listen;
  let finalText="";
  rec.onresult=(e)=>{ let txt=""; for(let i=0;i<e.results.length;i++) txt+=e.results[i][0].transcript;
    if(target==="q"){ $("q").value=txt.replace(/[.。!?！？]+$/,""); renderList(); }
    if(e.results[e.results.length-1].isFinal) finalText=txt; };
  rec.onerror=(e)=>{ msg.textContent=(e.error==="not-allowed"||e.error==="service-not-allowed")?t.micErr:(e.error==="no-speech"?t.noNum:t.micErr); stopRec(); };
  rec.onend=()=>{ const tx=finalText||(target==="q"?$("q").value:""); btn.classList.remove("on"); rec=null; voiceUsed=true;
    if(!tx){ if(msg.textContent===t.listen) msg.textContent=""; return; }
    const n=numFrom(tx);
    if(target==="q"){ $("q").value=tx.replace(/[.。!?！？]+$/,""); renderList();
      if(n!=null&&n>0){ spokenPrice=n; msg.textContent=t.heard(tx)+" · "+t.spoken(mad(n));
        const {res}=search(tx,cat); if(res.length===1) openItem(res[0]); }
      else msg.textContent=t.heard(tx);
      window.scrollTo({top:$("q").getBoundingClientRect().top+window.scrollY-8,behavior:"smooth"}); }
    else { if(n!=null){ $("price").value=n; msg.textContent=""; judge(); } else msg.textContent=t.noNum; }
  };
  try{ rec.start(); }catch(e){ msg.textContent=t.micErr; stopRec(); }
}
